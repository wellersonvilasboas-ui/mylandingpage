<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Obrigado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
    }

    .box{
      max-width:500px;
    }

    h1{
      font-size:40px;
      margin-bottom:10px;
    }

    p{
      color:#cbd5e1;
      font-size:18px;
    }

    a{
      display:inline-block;
      margin-top:20px;
      padding:12px 20px;
      background:#3b82f6;
      color:white;
      text-decoration:none;
      border-radius:10px;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Obrigado! 🎉</h1>
  <p>Seu envio foi recebido com sucesso.</p>

  <a href="https://www.inteligenteagente.com">Voltar ao site</a>

</html>
