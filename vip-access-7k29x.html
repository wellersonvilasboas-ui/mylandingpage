<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acesso Liberado</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter', sans-serif;
      background:
      radial-gradient(circle at top left,#0f172a,#020617);
      color:white;
      min-height:100vh;
      overflow-x:hidden;
    }

    .bg-glow{
      position:fixed;
      width:600px;
      height:600px;
      background:#2563eb;
      filter:blur(120px);
      opacity:0.18;
      top:-200px;
      left:-200px;
      z-index:0;
    }

    .bg-glow2{
      position:fixed;
      width:500px;
      height:500px;
      background:#7c3aed;
      filter:blur(120px);
      opacity:0.15;
      bottom:-200px;
      right:-150px;
      z-index:0;
    }

    .container{
      position:relative;
      z-index:2;
      max-width:1100px;
      margin:auto;
      padding:50px 20px;
    }

    .card{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(20px);
      border-radius:28px;
      overflow:hidden;
      box-shadow:
      0 20px 80px rgba(0,0,0,0.45);
    }

    .hero{
      padding:60px 40px 30px;
      text-align:center;
    }

    .badge{
      display:inline-block;
      padding:10px 18px;
      border-radius:999px;
      background:rgba(59,130,246,0.15);
      color:#93c5fd;
      font-size:14px;
      margin-bottom:24px;
      border:1px solid rgba(147,197,253,0.2);
    }

    h1{
      font-size:56px;
      line-height:1.1;
      font-weight:800;
      margin-bottom:20px;
    }

    .gradient{
      background:linear-gradient(90deg,#60a5fa,#a78bfa);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    p{
      color:#cbd5e1;
      font-size:18px;
      line-height:1.7;
      max-width:700px;
      margin:auto;
    }

    .divider{
      height:1px;
      background:rgba(255,255,255,0.08);
      margin-top:40px;
    }

    .form-area{
      padding:40px;
      background:rgba(255,255,255,0.03);
    }

    iframe{
      width:100%;
      height:1300px;
      border:none;
      border-radius:20px;
      background:white;
    }

    .footer{
      text-align:center;
      color:#94a3b8;
      padding:30px;
      font-size:14px;
    }

    @media(max-width:768px){

      h1{
        font-size:38px;
      }

      .hero{
        padding:40px 25px 20px;
      }

      .form-area{
        padding:20px;
      }

      iframe{
        height:1400px;
      }

    }

  </style>
</head>

<body>

<div class="bg-glow"></div>
<div class="bg-glow2"></div>

<div class="container">

  <div class="card">

    <div class="hero">

      <div class="badge">
        PAGAMENTO CONFIRMADO
      </div>

      <h1>
        Seu acesso foi <span class="gradient">liberado</span> 🎉
      </h1>

      <p>
        Complete o formulário abaixo para finalizar sua inscrição
        e receber os próximos passos.
      </p>

      <div class="divider"></div>

    </div>

    <div class="form-area">

      <div style="position:relative;width:100%;height:0;padding-bottom:120%;">
  <div class="form-container">

  <h2>Finalizar acesso</h2>
  <p>Preencha os dados abaixo para continuar.</p>

  <form id="vipForm">

    <label>Nome</label>
    <input type="text" placeholder="Seu nome" required>

    <label>E-mail</label>
    <input type="email" placeholder="Seu melhor e-mail" required>

    <label>WhatsApp</label>
    <input type="tel" placeholder="(11) 99999-9999" required>

    <button type="submit">Enviar e continuar</button>

  </form>

  <p id="msg"></p>

</div>

<style>
.form-container{
  max-width:600px;
  margin:auto;
  padding:30px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  color:white;
  font-family:Inter, sans-serif;
}

.form-container h2{
  font-size:28px;
  margin-bottom:10px;
}

.form-container p{
  color:#cbd5e1;
  margin-bottom:20px;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:5px;
  font-size:14px;
  color:#94a3b8;
}

input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(0,0,0,0.3);
  color:white;
  outline:none;
}

button{
  margin-top:20px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#3b82f6,#8b5cf6);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  opacity:0.9;
  transform:scale(1.02);
}

#msg{
  margin-top:15px;
  color:#22c55e;
}
</style>

<script>
document.getElementById("vipForm").addEventListener("submit", function(e){
  e.preventDefault();

  document.getElementById("msg").innerText =
  "✔ Enviado com sucesso! Redirecionando...";

  setTimeout(() => {
    window.location.href = "https://www.inteligenteagente.com/obrigado.html";
  }, 1500);
});
</script>
              
    </div>

    <div class="footer">
      © 2026 • Todos os direitos reservados
    </div>
  </div>

</div>

</body>
</html>
