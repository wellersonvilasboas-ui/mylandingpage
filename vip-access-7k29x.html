<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acesso Liberado</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter', sans-serif;
      background:
      radial-gradient(circle at top left,#0f172a,#020617);
      color:white;
      min-height:100vh;
      overflow-x:hidden;
    }

    .bg-glow{
      position:fixed;
      width:600px;
      height:600px;
      background:#2563eb;
      filter:blur(120px);
      opacity:0.18;
      top:-200px;
      left:-200px;
      z-index:0;
    }

    .bg-glow2{
      position:fixed;
      width:500px;
      height:500px;
      background:#7c3aed;
      filter:blur(120px);
      opacity:0.15;
      bottom:-200px;
      right:-150px;
      z-index:0;
    }

    .container{
      position:relative;
      z-index:2;
      max-width:1100px;
      margin:auto;
      padding:50px 20px;
    }

    .card{
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(20px);
      border-radius:28px;
      overflow:hidden;
      box-shadow:
      0 20px 80px rgba(0,0,0,0.45);
    }

    .hero{
      padding:60px 40px 30px;
      text-align:center;
    }

    .badge{
      display:inline-block;
      padding:10px 18px;
      border-radius:999px;
      background:rgba(59,130,246,0.15);
      color:#93c5fd;
      font-size:14px;
      margin-bottom:24px;
      border:1px solid rgba(147,197,253,0.2);
    }

    h1{
      font-size:56px;
      line-height:1.1;
      font-weight:800;
      margin-bottom:20px;
    }

    .gradient{
      background:linear-gradient(90deg,#60a5fa,#a78bfa);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    p{
      color:#cbd5e1;
      font-size:18px;
      line-height:1.7;
      max-width:700px;
      margin:auto;
    }

    .divider{
      height:1px;
      background:rgba(255,255,255,0.08);
      margin-top:40px;
    }

    .form-area{
      padding:40px;
      background:rgba(255,255,255,0.03);
    }

    iframe{
      width:100%;
      height:1300px;
      border:none;
      border-radius:20px;
      background:white;
    }

    .footer{
      text-align:center;
      color:#94a3b8;
      padding:30px;
      font-size:14px;
    }

    @media(max-width:768px){

      h1{
        font-size:38px;
      }

      .hero{
        padding:40px 25px 20px;
      }

      .form-area{
        padding:20px;
      }

      iframe{
        height:1400px;
      }

    }

  </style>
</head>

<body>

<div class="bg-glow"></div>
<div class="bg-glow2"></div>

<div class="container">

  <div class="card">

    <div class="hero">

      <div class="badge">
        PAGAMENTO CONFIRMADO
      </div>

      <h1>
        Seu acesso foi <span class="gradient">liberado</span> 🎉
      </h1>

      <p>
        Complete o formulário abaixo para finalizar sua inscrição
        e receber os próximos passos.
      </p>

      <div class="divider"></div>

    </div>

    <div class="form-area">

      <iframe
        src="<"https://docs.google.com/forms/d/e/1FAIpQLSdsWLUJ34yEF7EU_0Qgp9rVBEKj-EobKjhWN7z1B0ZpX9zfwg/viewform?embedded=true" width="640" height="2066" frameborder="0" marginheight="0" marginwidth="0">Carregando…</iframe>"
        loading="lazy">
      
    </div>

    <div class="footer">
      © 2026 • Todos os direitos reservados
    </div>

  </div>

</div>

</body>
</html>
