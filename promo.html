<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oferta Especial</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      text-align: center;
      margin: 0;
      padding: 60px 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: #1c1c1c;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #bbb;
      margin-bottom: 25px;
    }

    .price {
      font-size: 52px;
      color: #00ff88;
      font-weight: bold;
      margin: 20px 0;
    }

    .old-price {
      color: #888;
      text-decoration: line-through;
      margin-bottom: 10px;
    }

    .btn {
      display: inline-block;
      padding: 15px 30px;
      background: #635bff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      margin-top: 20px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #4a42d4;
    }

    .footer {
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔥 Oferta Exclusiva</h1>

    <p class="subtitle">Acesso imediato após pagamento</p>

    <div class="old-price">$199</div>

    <div class="price">$99</div>

    <p>Garanta agora sua vaga com preço promocional limitado.</p>

    <!-- COLE SEU LINK DO STRIPE AQUI -->
    <a class="btn" href="COLE_AQUI_SEU_LINK_DO_STRIPE" target="_blank">
      Comprar agora
    </a>

    <div class="footer">
      Pagamento seguro via Stripe
    </div>

  </div>

</body>
</html>
