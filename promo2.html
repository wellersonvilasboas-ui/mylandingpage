<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oferta Especial</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#0f0f0f;
      color:#fff;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      max-width:700px;
      width:100%;
      background:#1a1a1a;
      border-radius:20px;
      padding:50px 35px;
      text-align:center;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    .tag{
      display:inline-block;
      background:#ff2e2e;
      color:#fff;
      padding:10px 18px;
      border-radius:999px;
      font-size:14px;
      font-weight:bold;
      margin-bottom:25px;
      letter-spacing:1px;
    }

    h1{
      font-size:42px;
      line-height:1.2;
      margin-bottom:20px;
    }

    .old-price{
      font-size:32px;
      color:#999;
      text-decoration:line-through;
      margin-bottom:10px;
    }

    .new-price{
      font-size:68px;
      font-weight:900;
      color:#00ff88;
      margin-bottom:20px;
    }

    .description{
      font-size:18px;
      color:#d5d5d5;
      line-height:1.6;
      margin-bottom:35px;
    }

    .button{
      display:inline-block;
      background:#00c853;
      color:#fff;
      text-decoration:none;
      padding:18px 40px;
      border-radius:12px;
      font-size:20px;
      font-weight:bold;
      transition:0.3s;
    }

    .button:hover{
      background:#00e676;
      transform:translateY(-2px);
    }

    .warning{
      margin-top:25px;
      color:#bdbdbd;
      font-size:14px;
    }

    @media(max-width:768px){
      h1{
        font-size:32px;
      }

      .new-price{
        font-size:52px;
      }

      .old-price{
        font-size:24px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="tag">
      OFERTA OCULTA LIBERADA
    </div>

    <h1>
      Você recebeu uma condição exclusiva hoje
    </h1>

    <div class="old-price">
      De R$ 1.827
    </div>

    <div class="new-price">
      Por apenas R$ 497
    </div>

    <p class="description">
      Aproveite essa oportunidade única com desconto especial.
      Essa página é exclusiva e pode sair do ar a qualquer momento.
    </p>

    <a href="#" class="button">
      QUERO APROVEITAR AGORA
    </a>

    <div class="warning">
      Oferta válida somente nesta página.
    </div>

  </div>

</body>
</html>
